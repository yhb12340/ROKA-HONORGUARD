<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의장대에서 살아남기</title>
    <style>
        :root {
            --bg-color: #f2f5f3; /* 옅은 웜그레이 톤으로 정돈 */
            --text-color: #2b332c; 
            --primary-color: #1b4b36; /* 딥그린 (육군 의장대 메인 컬러) */
            --accent-color: #d4af37; /* 메탈릭 골드 */
            --btn-bg: #ffffff;
            --btn-hover: #f0f4f1;
            /* 플레이어 배경: 진초록과 검은색 그라데이션 */
            --player-bg: linear-gradient(145deg, #183325, #0d1a13);
            --player-text: #ffffff;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 마크 벡터 이미지(SVG) 스타일 --- */
        .mark-container {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
            margin-top: 4vh;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .mark-svg {
            width: 100%;
            height: 100%;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-top: 0; 
            margin-bottom: 30px;
            text-align: center;
            color: var(--primary-color);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: top center;
            letter-spacing: -0.5px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }

        .menu-container {
            display: flex;
            flex-direction: row;
            gap: 15px;
            width: 100%;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .menu-btn {
            background-color: var(--btn-bg);
            border: 1px solid rgba(27, 75, 54, 0.1);
            color: var(--primary-color);
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--gold-gradient);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            color: var(--primary-color);
            border-color: transparent;
        }
        
        .menu-btn:hover::before {
            opacity: 1;
        }

        /* 상세 화면 진입 시 타이틀/마크 애니메이션 */
        .app-container.state-content-active .mark-container {
            transform: translateY(-40px) scale(0.6);
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }

        .app-container.state-content-active .main-title {
            transform: translateY(-60px) scale(0.85);
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }

        .app-container.state-content-active .menu-container {
            transform: translateY(40px);
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }

        .content-container {
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(27, 75, 54, 0.08);
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            position: absolute;
            top: 80px;
            box-sizing: border-box;
            border-top: 4px solid var(--primary-color);
        }

        .app-container.state-content-active .content-container {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            position: relative;
            top: 0;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(27, 75, 54, 0.1);
            padding-bottom: 15px;
        }

        .content-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0;
            color: var(--primary-color);
        }

        .back-btn {
            background-color: transparent;
            color: var(--accent-color);
            border: none;
            padding: 8px 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 0.7;
        }

        /* --- Apple Music Style 개선 (색상 테마 반영) --- */
        .song-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(27, 75, 54, 0.05);
            padding: 6px;
            border-radius: 12px;
            overflow-x: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .song-selector::-webkit-scrollbar {
            display: none;
        }

        .song-tab {
            flex: 1;
            min-width: 80px;
            padding: 10px 5px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #7b8a81;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .song-tab.active {
            background: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(27, 75, 54, 0.2);
        }

        .music-player-container {
            background: var(--player-bg);
            border-radius: 24px;
            padding: 30px 20px;
            color: var(--player-text);
            box-shadow: 0 20px 40px rgba(13, 26, 19, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(212, 175, 55, 0.2); /* 은은한 골드 테두리 */
        }

        /* 플레이어 배경 골드 장식 */
        .music-player-container::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        .song-info {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            z-index: 1;
        }

        .song-title {
            font-size: 1.7rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
            color: var(--accent-color); /* 제목은 골드 */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .song-artist {
            font-size: 1rem;
            color: #a0b3a6;
            margin-top: 6px;
            font-weight: 500;
        }

        .lyrics-container {
            width: 100%;
            height: 280px;
            overflow-y: auto;
            text-align: center;
            margin: 10px 0 25px 0;
            padding: 20px 0;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            z-index: 1;
        }

        .lyrics-container::-webkit-scrollbar {
            display: none;
        }
        
        .lyrics-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .lyric-line {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 20px 0;
            color: #6a8071;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            line-height: 1.5;
            padding: 0 10px;
        }

        .lyric-line.active {
            font-size: 1.45rem;
            color: #ffffff;
            transform: scale(1.02);
            text-shadow: 0 2px 10px rgba(255,255,255,0.3);
        }

        .player-controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #a0b3a6;
            margin-bottom: 20px;
        }

        .progress-bar-bg {
            flex: 1;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--gold-gradient);
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(212, 175, 55, 0.8);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar-bg:hover .progress-bar-fill::after {
            opacity: 1;
        }

        .play-btn {
            background: #ffffff;
            border: none;
            color: var(--primary-color);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease, background-color 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .play-btn:active {
            transform: scale(0.92);
            background-color: #f0f0f5;
        }

        /* --- 리스트 및 기타 컨텐츠 스타일 --- */
        ol.custom-list {
            list-style: none;
            counter-reset: item;
            padding: 0;
            margin: 0;
        }

        ol.custom-list > li {
            counter-increment: item;
            margin-bottom: 18px;
            padding-left: 42px;
            position: relative;
            line-height: 1.6;
            font-size: 1.05rem;
            color: #333333;
        }

        ol.custom-list > li::before {
            content: counter(item);
            position: absolute;
            left: 0;
            top: 2px;
            width: 26px;
            height: 26px;
            background-color: var(--primary-color);
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: 0 2px 5px rgba(27, 75, 54, 0.3);
        }

        .notice-box {
            background-color: #fdfaf0;
            border-left: 4px solid var(--accent-color);
            padding: 16px 20px;
            margin-bottom: 25px;
            border-radius: 0 12px 12px 0;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1.5;
            font-size: 0.95rem;
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.1);
        }

        .highlight {
            color: var(--accent-color);
            font-weight: 800;
            text-shadow: 0px 0px 1px rgba(212, 175, 55, 0.3);
        }

        @media (max-width: 600px) {
            .menu-container { flex-direction: column; }
            .menu-btn { width: 100%; }
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    
    <!-- 부대 마크 벡터 이미지 (호랑이 방패 문양) -->
    <div class="mark-container">
        <svg class="mark-svg" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#bf953f" />
                    <stop offset="25%" stop-color="#fcf6ba" />
                    <stop offset="50%" stop-color="#b38728" />
                    <stop offset="75%" stop-color="#fbf5b7" />
                    <stop offset="100%" stop-color="#aa771c" />
                </linearGradient>
                <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#2a5a41" />
                    <stop offset="100%" stop-color="#143323" />
                </linearGradient>
                <filter id="shadow">
                    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
                </filter>
            </defs>
            <!-- 상단 리본 -->
            <path d="M 10,20 Q 50,30 90,20 L 85,35 Q 50,45 15,35 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
            <text x="50" y="34" font-size="12" font-weight="900" fill="#1b4b36" text-anchor="middle" style="letter-spacing: 2px;">대한민국</text>
            
            <!-- 방패 테두리 -->
            <path d="M 20,40 Q 50,50 80,40 Q 90,70 85,90 Q 50,120 15,90 Q 10,70 20,40 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
            <!-- 방패 배경 -->
            <path d="M 23,43 Q 50,52 77,43 Q 86,70 82,88 Q 50,115 18,88 Q 14,70 23,43 Z" fill="url(#shieldBg)"/>
            
            <!-- 호랑이 형상 (단순화된 벡터) -->
            <path d="M 35,55 L 45,65 L 55,65 L 65,55 L 60,75 L 55,85 L 45,85 L 40,75 Z" fill="url(#goldGrad)"/>
            <!-- 눈 -->
            <circle cx="43" cy="62" r="2" fill="#1b4b36"/>
            <circle cx="57" cy="62" r="2" fill="#1b4b36"/>
            <!-- 코/입술 무늬 -->
            <path d="M 50,68 L 47,75 L 53,75 Z" fill="#1b4b36"/>
            <path d="M 45,80 Q 50,85 55,80" fill="none" stroke="#1b4b36" stroke-width="2"/>
            
            <!-- 하단 텍스트 -->
            <text x="50" y="100" font-size="11" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">의 장 대</text>
            <text x="50" y="112" font-size="10" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">육  군</text>
        </svg>
    </div>

    <h1 class="main-title">의장대에서 살아남기</h1>
    
    <div class="menu-container">
        <button class="menu-btn" onclick="openContent('life')">생활편</button>
        <button class="menu-btn" onclick="openContent('training')">행사/훈련편</button>
        <button class="menu-btn" onclick="openContent('song')">군가편</button>
    </div>

    <div class="content-container">
        <div class="content-header">
            <h2 class="content-title" id="content-title"></h2>
            <button class="back-btn" onclick="closeContent()">돌아가기</button>
        </div>
        <div id="content-body"></div>
    </div>
</div>

<audio id="audio-player"></audio>

<script>
    const songContentHTML = `
        <div class="song-selector" id="song-selector">
            <button class="song-tab active" onclick="selectSong(0)">군조가</button>
            <button class="song-tab" onclick="selectSong(1)">의장대가</button>
            <button class="song-tab" onclick="selectSong(2)">계룡산 호랑이</button>
        </div>

        <div class="music-player-container">
            <div class="song-info">
                <h3 class="song-title" id="song-title">군조가</h3>
                <div class="song-artist" id="song-artist">의장대군가</div>
            </div>
            
            <div class="lyrics-container" id="lyrics-container">
                <!-- 가사가 여기에 동적으로 추가됩니다 -->

            <div class="player-controls">
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar-bg" id="progress-bar-bg" onclick="seekSong(event)">
                        <div class="progress-bar-fill" id="progress-bar-fill"></div>

                    <span id="total-time">0:00</span>
                </div>
                
                <button class="play-btn" id="play-btn" onclick="togglePlay()">&#9654;</button>
            </div>
        </div>
    `;

    const contentData = {
        life: {
            title: "생활편",
            html: `

                </ol>
            `
        },
        training: {
            title: "행사/훈련편",

    let currentSongIndex = 0;
    let isPlaying = false;
    let audioPlayer = document.getElementById('audio-player');

    const app = document.getElementById('app');
    const contentTitle = document.getElementById('content-title');
    const contentBody = document.getElementById('content-body');

    function openContent(section) {
        contentTitle.innerText = contentData[section].title;
        contentBody.innerHTML = contentData[section].html;
        app.classList.add('state-content-active');
        
        if (section === 'song') {
            initPlayer();
        } else {
            resetPlayer();
        }
    }

    function closeContent() {
        app.classList.remove('state-content-active');
        resetPlayer();
    }

    function initPlayer() {
        audioPlayer = document.getElementById('audio-player');
        
        audioPlayer.removeEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('loadedmetadata', () => {
            document.getElementById('total-time').innerText = formatTime(audioPlayer.duration);
        });
        audioPlayer.addEventListener('ended', () => {
            resetPlayerUI();
        });
        
        loadSong(currentSongIndex);
        updateTabsUI();
    }

    function selectSong(index) {
        if (currentSongIndex === index) return;
        currentSongIndex = index;
        loadSong(index);
        updateTabsUI();
        
        // 탭 변경 시 자동 재생
        audioPlayer.play().then(() => {
            isPlaying = true;
            document.getElementById('play-btn').innerHTML = '&#10074;&#10074;';
        }).catch(e => console.log("Autoplay blocked:", e));
    }

    function updateTabsUI() {
        const tabs = document.querySelectorAll('.song-tab');
        tabs.forEach((tab, i) => {
            if (i === currentSongIndex) {
                tab.classList.add('active');
            } else {
                tab.classList.remove('active');
            }
        });
    }

    function loadSong(index) {
        const song = songs[index];
        document.getElementById('song-title').innerText = song.title;
        document.getElementById('song-artist').innerText = song.artist;
        
        audioPlayer.src = song.src;
        audioPlayer.load();
        
        const lyricsContainer = document.getElementById('lyrics-container');
        lyricsContainer.innerHTML = '';
        
        song.lyrics.forEach((line) => {
            const el = document.createElement('div');
            el.className = 'lyric-line';
            el.innerText = line.text;
            el.onclick = () => jumpToTime(line.time);
            lyricsContainer.appendChild(el);
        });
        
        document.getElementById('current-time').innerText = "0:00";
        document.getElementById('progress-bar-fill').style.width = '0%';
        
        if(isPlaying) {
            document.getElementById('play-btn').innerHTML = '&#10074;&#10074;';
        } else {
            document.getElementById('play-btn').innerHTML = '&#9654;';
        }
    }

    function togglePlay() {
        const btn = document.getElementById('play-btn');
        if (audioPlayer.paused) {
            audioPlayer.play();
            isPlaying = true;
            btn.innerHTML = '&#10074;&#10074;';
        } else {
            audioPlayer.pause();
            isPlaying = false;
            btn.innerHTML = '&#9654;';
        }
    }

    function resetPlayer() {
        if (audioPlayer) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }
        isPlaying = false;
        currentSongIndex = 0; // 돌아갈때 초기화
    }

    function resetPlayerUI() {
        isPlaying = false;
        document.getElementById('play-btn').innerHTML = '&#9654;';
        audioPlayer.currentTime = 0;
        document.getElementById('progress-bar-fill').style.width = '0%';
        document.getElementById('current-time').innerText = "0:00";
    }

    function updateProgress() {
        if (!audioPlayer.duration) return;
        
        const currentTime = audioPlayer.currentTime;
        const duration = audioPlayer.duration;
        const pct = (currentTime / duration) * 100;
        
        document.getElementById('progress-bar-fill').style.width = pct + '%';
        document.getElementById('current-time').innerText = formatTime(Math.floor(currentTime));
        
        // Sync lyrics
        const song = songs[currentSongIndex];
        const lines = document.querySelectorAll('.lyric-line');
        let activeIndex = -1;
        
        for (let i = 0; i < song.lyrics.length; i++) {
            if (currentTime >= song.lyrics[i].time) {
                activeIndex = i;
            }
        }
        
        lines.forEach((line, index) => {
            if (index === activeIndex) {
                if (!line.classList.contains('active')) {
                    line.classList.add('active');
                    // 가사가 부드럽게 중앙에 오도록 스크롤 조절
                    line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } else {
                line.classList.remove('active');
            }
        });
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ":" + (s < 10 ? '0' : '') + s;
    }

    function jumpToTime(time) {
        audioPlayer.currentTime = time;
        if (!isPlaying) togglePlay();
    }

    function seekSong(event) {
        const bg = document.getElementById('progress-bar-bg');
        const rect = bg.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const width = rect.width;
        const pct = clickX / width;
        audioPlayer.currentTime = pct * audioPlayer.duration;
    }
</script>
