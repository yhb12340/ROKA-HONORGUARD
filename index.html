<!DOCTYPE html><!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의장대에서 살아남기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --bg-dark-green: #0c261a;
            --primary-deep: #113826;
            --primary-color: #174932;
            --primary-mid: #1f5c40;
            --primary-soft: #eef4f0;
            --primary-tint: #f6f9f7;

            --accent-color: #d4af37;
            --accent-bright: #f3d46b;
            --accent-deep: #9e7a18;
            --accent-soft: #fcf7e6;

            --pure-white: #ffffff;
            --text-main: #18241d;
            --text-sub: #4c5d53;
            --text-muted: #76877d;

            --gold-gradient: linear-gradient(135deg, #b88a28 0%, #f5df8b 35%, #d4af37 55%, #fff1b8 78%, #9e7318 100%);
            --green-hero-gradient: linear-gradient(160deg, #0b2217 0%, #143d29 52%, #1b4f36 100%);
            --player-bg: linear-gradient(165deg, #102e20 0%, #091a12 65%, #050f0a 100%);
            --card-shadow: 0 18px 45px rgba(10, 34, 23, 0.14);
            --subtle-shadow: 0 6px 18px rgba(17, 56, 38, 0.07);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background:
                radial-gradient(circle at 18% 12%, rgba(212, 175, 55, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 82% 88%, rgba(23, 73, 50, 0.18) 0%, transparent 45%),
                linear-gradient(180deg, #0d291c 0%, #133927 280px, #eff4f1 280px, #eff4f1 100%);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gold-gradient);
            z-index: 100;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.45);
        }

        .app-container {
            width: 100%;
            max-width: 680px;
            padding: 28px 20px 48px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-card {
            width: 100%;
            background: var(--green-hero-gradient);
            border-radius: 28px;
            padding: 36px 28px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 22px 50px rgba(7, 24, 16, 0.32);
            border: 1px solid rgba(212, 175, 55, 0.42);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            margin-top: 1.5vh;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 21px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            pointer-events: none;
        }

        .hero-card::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -20%;
            width: 140%;
            height: 120%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.16) 0%, transparent 62%);
            pointer-events: none;
        }

        .unit-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: var(--accent-bright);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            margin-bottom: 18px;
            z-index: 1;
        }

        .unit-pill-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-bright);
            box-shadow: 0 0 8px var(--accent-bright);
        }

        .mark-container {
            width: 132px;
            height: 140px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .mark-glow {
            position: absolute;
            width: 126px;
            height: 126px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(212, 175, 55, 0.18) 45%, transparent 72%);
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
        }

        .mark-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45));
            transition: transform 0.35s ease;
        }

        .mark-container:hover .mark-img {
            transform: translateY(-3px) scale(1.03);
        }

        .main-title {
            font-size: 2.15rem;
            font-weight: 800;
            margin: 0;
            text-align: center;
            color: var(--pure-white);
            letter-spacing: -0.6px;
            z-index: 1;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            width: 100%;
            margin-top: 20px;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .menu-btn {
            background: var(--pure-white);
            border: 1px solid rgba(23, 73, 50, 0.14);
            color: var(--primary-deep);
            padding: 22px 16px 20px;
            font-size: 1.12rem;
            font-weight: 800;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gold-gradient);
            opacity: 0.85;
            transition: height 0.25s ease;
        }

        .menu-btn-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--primary-soft);
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
            transition: all 0.3s ease;
        }

        .menu-btn-label {
            font-size: 1.12rem;
            font-weight: 800;
            color: var(--primary-deep);
            letter-spacing: -0.3px;
        }

        .menu-btn-desc {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1.35;
        }

        .menu-btn-count {
            margin-top: 4px;
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--accent-deep);
            background: var(--accent-soft);
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 38px rgba(12, 38, 26, 0.2);
            border-color: var(--accent-color);
        }

        .menu-btn:hover .menu-btn-icon {
            background: var(--primary-color);
            color: var(--accent-bright);
            border-color: var(--accent-color);
        }

        .app-container.state-content-active .hero-card,
        .app-container.state-content-active .menu-container {
            transform: translateY(-30px) scale(0.96);
            opacity: 0;
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }

        .content-container {
            width: 100%;
            background: var(--pure-white);
            border-radius: 26px;
            padding: 0;
            box-shadow: 0 22px 55px rgba(10, 34, 23, 0.18);
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            pointer-events: none;
            transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
            position: absolute;
            top: 28px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.38);
            visibility: hidden;
        }

        .app-container.state-content-active .content-container {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            position: relative;
            top: 0;
            margin-top: 4px;
            margin-bottom: 32px;
            visibility: visible;
        }

        .content-header {
            background: var(--green-hero-gradient);
            padding: 22px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent-color);
            position: relative;
            overflow: hidden;
        }

        .content-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1;
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            color: var(--pure-white);
            letter-spacing: -0.4px;
        }

        .back-btn::before { content: '← '; }
        .back-btn {
            background: rgba(255, 255, 255, 0.12);
            color: var(--pure-white);
            border: 1px solid rgba(212, 175, 55, 0.55);
            padding: 9px 16px;
            font-size: 0.92rem;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            z-index: 1;
        }

        .back-btn:hover {
            background: var(--pure-white);
            color: var(--primary-deep);
            border-color: var(--pure-white);
            transform: translateX(-2px);
        }

        #content-body {
            padding: 24px;
        }

        @media (max-width: 600px) {
            .app-container {
                padding: 18px 14px 36px;
            }
            .hero-card {
                padding: 28px 18px 24px;
            }
            .main-title {
                font-size: 1.8rem;
            }
            .menu-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .menu-btn {
                flex-direction: row;
                justify-content: flex-start;
                text-align: left;
                padding: 16px 18px;
                gap: 14px;
            }
            .menu-btn-count {
                margin-top: 0;
            }
            .content-header {
                padding: 18px 18px 16px;
            }
            #content-body {
                padding: 18px 16px;
            }
        }
    </style>
</head>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의장대에서 살아남기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --bg-dark-green: #0c261a;
            --primary-deep: #113826;
            --primary-color: #174932;
            --primary-mid: #1f5c40;
            --primary-soft: #eef4f0;
            --primary-tint: #f6f9f7;

            --accent-color: #d4af37;
            --accent-bright: #f3d46b;
            --accent-deep: #9e7a18;
            --accent-soft: #fcf7e6;

            --pure-white: #ffffff;
            --text-main: #18241d;
            --text-sub: #4c5d53;
            --text-muted: #76877d;

            --gold-gradient: linear-gradient(135deg, #b88a28 0%, #f5df8b 35%, #d4af37 55%, #fff1b8 78%, #9e7318 100%);
            --green-hero-gradient: linear-gradient(160deg, #0b2217 0%, #143d29 52%, #1b4f36 100%);
            --player-bg: linear-gradient(165deg, #102e20 0%, #091a12 65%, #050f0a 100%);
            --card-shadow: 0 18px 45px rgba(10, 34, 23, 0.14);
            --subtle-shadow: 0 6px 18px rgba(17, 56, 38, 0.07);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background:
                radial-gradient(circle at 18% 12%, rgba(212, 175, 55, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 82% 88%, rgba(23, 73, 50, 0.18) 0%, transparent 45%),
                linear-gradient(180deg, #0d291c 0%, #133927 280px, #eff4f1 280px, #eff4f1 100%);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gold-gradient);
            z-index: 100;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.45);
        }

        .app-container {
            width: 100%;
            max-width: 680px;
            padding: 28px 20px 48px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-card {
            width: 100%;
            background: var(--green-hero-gradient);
            border-radius: 28px;
            padding: 36px 28px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 22px 50px rgba(7, 24, 16, 0.32);
            border: 1px solid rgba(212, 175, 55, 0.42);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            margin-top: 1.5vh;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 21px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            pointer-events: none;
        }

        .hero-card::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -20%;
            width: 140%;
            height: 120%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.16) 0%, transparent 62%);
            pointer-events: none;
        }

        .unit-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: var(--accent-bright);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            margin-bottom: 18px;
            z-index: 1;
        }

        .unit-pill-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-bright);
            box-shadow: 0 0 8px var(--accent-bright);
        }

        .mark-container {
            width: 132px;
            height: 140px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .mark-glow {
            position: absolute;
            width: 126px;
            height: 126px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(212, 175, 55, 0.18) 45%, transparent 72%);
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
        }

        .mark-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45));
            transition: transform 0.35s ease;
        }

        .mark-container:hover .mark-img {
            transform: translateY(-3px) scale(1.03);
        }

        .main-title {
            font-size: 2.15rem;
            font-weight: 800;
            margin: 0;
            text-align: center;
            color: var(--pure-white);
            letter-spacing: -0.6px;
            z-index: 1;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            width: 100%;
            margin-top: 20px;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .menu-btn {
            background: var(--pure-white);
            border: 1px solid rgba(23, 73, 50, 0.14);
            color: var(--primary-deep);
            padding: 22px 16px 20px;
            font-size: 1.12rem;
            font-weight: 800;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gold-gradient);
            opacity: 0.85;
            transition: height 0.25s ease;
        }

        .menu-btn-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--primary-soft);
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
            transition: all 0.3s ease;
        }

        .menu-btn-label {
            font-size: 1.12rem;
            font-weight: 800;
            color: var(--primary-deep);
            letter-spacing: -0.3px;
        }

        .menu-btn-desc {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1.35;
        }

        .menu-btn-count {
            margin-top: 4px;
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--accent-deep);
            background: var(--accent-soft);
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 38px rgba(12, 38, 26, 0.2);
            border-color: var(--accent-color);
        }

        .menu-btn:hover .menu-btn-icon {
            background: var(--primary-color);
            color: var(--accent-bright);
            border-color: var(--accent-color);
        }

        .app-container.state-content-active .hero-card,
        .app-container.state-content-active .menu-container {
            transform: translateY(-30px) scale(0.96);
            opacity: 0;
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }

        .content-container {
            width: 100%;
            background: var(--pure-white);
            border-radius: 26px;
            padding: 0;
            box-shadow: 0 22px 55px rgba(10, 34, 23, 0.18);
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            pointer-events: none;
            transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
            position: absolute;
            top: 28px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.38);
            visibility: hidden;
        }

        .app-container.state-content-active .content-container {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            position: relative;
            top: 0;
            margin-top: 4px;
            margin-bottom: 32px;
            visibility: visible;
        }

        .content-header {
            background: var(--green-hero-gradient);
            padding: 22px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent-color);
            position: relative;
            overflow: hidden;
        }

        .content-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1;
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            color: var(--pure-white);
            letter-spacing: -0.4px;
        }

        .back-btn::before { content: '← '; }
        .back-btn {
            background: rgba(255, 255, 255, 0.12);
            color: var(--pure-white);
            border: 1px solid rgba(212, 175, 55, 0.55);
            padding: 9px 16px;
            font-size: 0.92rem;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            z-index: 1;
        }

        .back-btn:hover {
            background: var(--pure-white);
            color: var(--primary-deep);
            border-color: var(--pure-white);
            transform: translateX(-2px);
        }

        #content-body {
            padding: 24px;
        }

        @media (max-width: 600px) {
            .app-container {
                padding: 18px 14px 36px;
            }
            .hero-card {
                padding: 28px 18px 24px;
            }
            .main-title {
                font-size: 1.8rem;
            }
            .menu-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .menu-btn {
                flex-direction: row;
                justify-content: flex-start;
                text-align: left;
                padding: 16px 18px;
                gap: 14px;
            }
            .menu-btn-count {
                margin-top: 0;
            }
            .content-header {
                padding: 18px 18px 16px;
            }
            #content-body {
                padding: 18px 16px;
            }
        }
    </style>
</head>
