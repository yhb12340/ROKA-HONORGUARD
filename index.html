<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의장대에서 살아남기 — 육군 의장대 신병 가이드북</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            /* 육군 의장대 시그니처 컬러 팔레트: 딥그린(메인) + 골드 & 화이트(포인트) */
            --bg-dark-green: #0c261a;
            --primary-deep: #113826;
            --primary-color: #174932;
            --primary-mid: #1f5c40;
            --primary-soft: #eef4f0;
            --primary-tint: #f6f9f7;

            --accent-color: #d4af37;
            --accent-bright: #f3d46b;
            --accent-deep: #9e7a18;
            --accent-soft: #fcf7e6;

            --pure-white: #ffffff;
            --text-main: #18241d;
            --text-sub: #4c5d53;
            --text-muted: #76877d;

            --gold-gradient: linear-gradient(135deg, #b88a28 0%, #f5df8b 35%, #d4af37 55%, #fff1b8 78%, #9e7318 100%);
            --green-hero-gradient: linear-gradient(160deg, #0b2217 0%, #143d29 52%, #1b4f36 100%);
            --player-bg: linear-gradient(165deg, #102e20 0%, #091a12 65%, #050f0a 100%);
            --card-shadow: 0 18px 45px rgba(10, 34, 23, 0.14);
            --subtle-shadow: 0 6px 18px rgba(17, 56, 38, 0.07);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background:
                radial-gradient(circle at 18% 12%, rgba(212, 175, 55, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 82% 88%, rgba(23, 73, 50, 0.18) 0%, transparent 45%),
                linear-gradient(180deg, #0d291c 0%, #133927 280px, #eff4f1 280px, #eff4f1 100%);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* 상단 예식 골드 라인 장식 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gold-gradient);
            z-index: 100;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.45);
        }

        .app-container {
            width: 100%;
            max-width: 680px;
            padding: 28px 20px 48px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 메인 히어로 영역 (부대 마크 & 타이틀) --- */
        .hero-card {
            width: 100%;
            background: var(--green-hero-gradient);
            border-radius: 28px;
            padding: 36px 28px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 22px 50px rgba(7, 24, 16, 0.32);
            border: 1px solid rgba(212, 175, 55, 0.42);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            margin-top: 1.5vh;
        }

        /* 예식 흰대각/금장 테두리 모티프 */
        .hero-card::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 21px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            pointer-events: none;
        }

        .hero-card::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -20%;
            width: 140%;
            height: 120%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.16) 0%, transparent 62%);
            pointer-events: none;
        }

        .unit-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: var(--accent-bright);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            margin-bottom: 18px;
            z-index: 1;
        }

        .unit-pill-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-bright);
            box-shadow: 0 0 8px var(--accent-bright);
        }

        /* --- 부대 마크 이미지 스타일 --- */
        .mark-container {
            width: 132px;
            height: 140px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .mark-glow {
            position: absolute;
            width: 126px;
            height: 126px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(212, 175, 55, 0.18) 45%, transparent 72%);
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
        }

        .mark-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45));
            transition: transform 0.35s ease;
        }

        .mark-container:hover .mark-img {
            transform: translateY(-3px) scale(1.03);
        }

        .main-title {
            font-size: 2.15rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            text-align: center;
            color: var(--pure-white);
            letter-spacing: -0.6px;
            z-index: 1;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .main-subtitle {
            font-size: 0.96rem;
            color: rgba(255, 255, 255, 0.82);
            margin: 0 0 22px 0;
            text-align: center;
            font-weight: 500;
            z-index: 1;
            line-height: 1.5;
        }

        .gold-divider {
            width: 72px;
            height: 3px;
            border-radius: 999px;
            background: var(--gold-gradient);
            margin-bottom: 24px;
            z-index: 1;
        }

        .motto-strip {
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--pure-white);
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 1;
        }

        .motto-badge {
            background: var(--gold-gradient);
            color: #102a1d;
            font-size: 0.74rem;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        /* --- 메인 메뉴 카드 버튼 --- */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            width: 100%;
            margin-top: 20px;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .menu-btn {
            background: var(--pure-white);
            border: 1px solid rgba(23, 73, 50, 0.14);
            color: var(--primary-deep);
            padding: 22px 16px 20px;
            font-size: 1.12rem;
            font-weight: 800;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gold-gradient);
            opacity: 0.85;
            transition: height 0.25s ease;
        }

        .menu-btn-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--primary-soft);
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
            transition: all 0.3s ease;
        }

        .menu-btn-label {
            font-size: 1.12rem;
            font-weight: 800;
            color: var(--primary-deep);
            letter-spacing: -0.3px;
        }

        .menu-btn-desc {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1.35;
        }

        .menu-btn-count {
            margin-top: 4px;
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--accent-deep);
            background: var(--accent-soft);
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 38px rgba(12, 38, 26, 0.2);
            border-color: var(--accent-color);
        }

        .menu-btn:hover .menu-btn-icon {
            background: var(--primary-color);
            color: var(--accent-bright);
            border-color: var(--accent-color);
        }

        /* 홈 하단 퀵 요약 배너 */
        .home-footer-tip {
            width: 100%;
            margin-top: 18px;
            background: var(--pure-white);
            border-radius: 18px;
            padding: 16px 20px;
            border: 1px solid rgba(23, 73, 50, 0.1);
            box-shadow: var(--subtle-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            transition: all 0.4s ease;
        }

        .home-footer-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .home-footer-emblem {
            width: 36px;
            height: 38px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .home-footer-text {
            font-size: 0.86rem;
            color: var(--text-sub);
            line-height: 1.45;
            font-weight: 500;
        }

        .home-footer-text strong {
            color: var(--primary-deep);
            font-weight: 800;
        }

        /* --- 상세 화면 진입 시 전환 애니메이션 --- */
        .app-container.state-content-active .hero-card,
        .app-container.state-content-active .menu-container,
        .app-container.state-content-active .home-footer-tip {
            transform: translateY(-30px) scale(0.96);
            opacity: 0;
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }

        /* --- 컨텐츠 컨테이너 --- */
        .content-container {
            width: 100%;
            background: var(--pure-white);
            border-radius: 26px;
            padding: 0;
            box-shadow: 0 22px 55px rgba(10, 34, 23, 0.18);
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            pointer-events: none;
            transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
            position: absolute;
            top: 28px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.38);
            visibility: hidden;
        }

        .app-container.state-content-active .content-container {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            position: relative;
            top: 0;
            margin-top: 4px;
            margin-bottom: 32px;
            visibility: visible;
        }

        /* 상세 페이지 상단 헤더 (딥그린 + 골드 + 화이트 포인트) */
        .content-header {
            background: var(--green-hero-gradient);
            padding: 22px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent-color);
            position: relative;
            overflow: hidden;
        }

        /* 헤더 배경 워터마크 마크 */
        .header-watermark {
            position: absolute;
            right: 110px;
            top: -18px;
            width: 110px;
            height: 110px;
            object-fit: contain;
            opacity: 0.08;
            pointer-events: none;
        }

        .content-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1;
        }

        .header-mini-mark {
            width: 38px;
            height: 40px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
        }

        .content-title-group {
            display: flex;
            flex-direction: column;
        }

        .content-eyebrow {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent-bright);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            color: var(--pure-white);
            letter-spacing: -0.4px;
        }

        .back-btn::before { content: '← '; }
        .back-btn {
            background: rgba(255, 255, 255, 0.12);
            color: var(--pure-white);
            border: 1px solid rgba(212, 175, 55, 0.55);
            padding: 9px 16px;
            font-size: 0.92rem;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            z-index: 1;
        }

        .back-btn:hover {
            background: var(--pure-white);
            color: var(--primary-deep);
            border-color: var(--pure-white);
            transform: translateX(-2px);
        }

        /* 섹션 간 빠른 이동 탭 바 */
        .quick-nav-bar {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            background: var(--primary-soft);
            border-bottom: 1px solid rgba(23, 73, 50, 0.09);
        }

        .quick-nav-pill {
            flex: 1;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .quick-nav-pill:hover {
            color: var(--primary-deep);
            background: rgba(255, 255, 255, 0.65);
        }

        .quick-nav-pill.active {
            background: var(--pure-white);
            color: var(--primary-deep);
            border-color: rgba(212, 175, 55, 0.55);
            box-shadow: 0 2px 8px rgba(17, 56, 38, 0.08);
        }

        #content-body {
            padding: 24px;
        }

        /* --- 검색 및 카테고리 필터 바 (생활편) --- */
        .filter-toolbar {
            margin-bottom: 20px;
            background: var(--primary-tint);
            border: 1px solid rgba(23, 73, 50, 0.1);
            border-radius: 16px;
            padding: 14px;
        }

        .search-input-wrap {
            position: relative;
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            padding: 11px 14px 11px 38px;
            border-radius: 11px;
            border: 1px solid rgba(23, 73, 50, 0.18);
            background: var(--pure-white);
            font-size: 0.92rem;
            font-family: inherit;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(23, 73, 50, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .category-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .cat-chip {
            border: 1px solid rgba(23, 73, 50, 0.14);
            background: var(--pure-white);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-chip:hover {
            border-color: var(--primary-color);
            color: var(--primary-deep);
        }

        .cat-chip.active {
            background: var(--primary-color);
            color: var(--pure-white);
            border-color: var(--primary-color);
        }

        /* --- 공지/신조 박스 --- */
        .notice-box {
            background: linear-gradient(135deg, #133c28 0%, #1b5238 100%);
            border: 1px solid rgba(212, 175, 55, 0.55);
            border-left: 5px solid var(--accent-color);
            padding: 18px 20px;
            margin-bottom: 22px;
            border-radius: 14px;
            font-weight: 700;
            color: var(--pure-white);
            line-height: 1.55;
            font-size: 0.98rem;
            box-shadow: 0 8px 20px rgba(17, 56, 38, 0.15);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .notice-box-mark {
            width: 40px;
            height: 42px;
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
        }

        .notice-box-text {
            flex: 1;
        }

        .notice-box-label {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--accent-bright);
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        /* --- 리스트 및 수칙 카드 스타일 --- */
        ol.custom-list {
            list-style: none;
            counter-reset: item;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        ol.custom-list > li {
            counter-increment: item;
            margin: 0;
            padding: 15px 16px 15px 54px;
            position: relative;
            line-height: 1.6;
            font-size: 0.98rem;
            color: var(--text-main);
            background: var(--pure-white);
            border: 1px solid rgba(23, 73, 50, 0.1);
            border-radius: 14px;
            box-shadow: 0 2px 6px rgba(17, 56, 38, 0.03);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        ol.custom-list > li:hover {
            transform: translateY(-1px);
            border-color: rgba(212, 175, 55, 0.55);
            box-shadow: 0 6px 14px rgba(17, 56, 38, 0.07);
        }

        ol.custom-list > li::before {
            content: counter(item, decimal-leading-zero);
            position: absolute;
            left: 14px;
            top: 14px;
            width: 30px;
            height: 30px;
            background: var(--primary-color);
            color: var(--accent-bright);
            border: 1px solid rgba(212, 175, 55, 0.55);
            border-radius: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.82rem;
            font-weight: 800;
            box-shadow: 0 2px 6px rgba(23, 73, 50, 0.2);
        }

        /* 강조 항목 (.highlight) 가독성 및 골드 포인트 개선 */
        .highlight {
            color: #7a5600;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.22), rgba(212, 175, 55, 0.1));
            border-bottom: 2px solid var(--accent-color);
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 800;
        }

        ol.custom-list > li.is-highlight-row {
            background: linear-gradient(135deg, #fffdf6 0%, #fcf6e1 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.65);
        }

        ol.custom-list > li.is-highlight-row::before {
            background: var(--gold-gradient);
            color: var(--bg-dark-green);
            border-color: #9e7a18;
        }

        .empty-filter-msg {
            display: none;
            text-align: center;
            padding: 28px 16px;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            background: var(--primary-tint);
            border-radius: 14px;
            border: 1px dashed rgba(23, 73, 50, 0.2);
        }

        /* --- 군가편 플레이어 (의장대 테마 + 마크 포인트) --- */
        .song-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--primary-soft);
            padding: 6px;
            border-radius: 14px;
            border: 1px solid rgba(23, 73, 50, 0.1);
            overflow-x: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .song-selector::-webkit-scrollbar {
            display: none;
        }

        .song-tab {
            flex: 1;
            min-width: 96px;
            padding: 11px 10px;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .song-tab:hover {
            color: var(--primary-deep);
        }

        .song-tab.active {
            background: var(--primary-color);
            color: var(--pure-white);
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: 0 4px 12px rgba(23, 73, 50, 0.25);
        }

        .music-player-container {
            background: var(--player-bg);
            border-radius: 24px;
            padding: 28px 22px 26px;
            color: var(--pure-white);
            box-shadow: 0 22px 45px rgba(7, 22, 14, 0.35);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1.5px solid rgba(212, 175, 55, 0.42);
        }

        .music-player-container::before {
            content: '';
            position: absolute;
            top: -40%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 58%);
            pointer-events: none;
        }

        .player-emblem-badge {
            width: 58px;
            height: 62px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-emblem-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
        }

        .song-info {
            text-align: center;
            margin-bottom: 16px;
            width: 100%;
            z-index: 1;
        }

        .song-title {
            font-size: 1.65rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
            color: var(--accent-bright);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        }

        .song-artist {
            font-size: 0.92rem;
            color: rgba(255, 255, 255, 0.72);
            margin-top: 5px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .lyrics-helper-tip {
            font-size: 0.76rem;
            color: rgba(243, 212, 107, 0.85);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 8px;
            z-index: 1;
        }

        .lyrics-container {
            width: 100%;
            height: 270px;
            overflow-y: auto;
            text-align: center;
            margin: 6px 0 22px 0;
            padding: 24px 8px;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent, black 14%, black 86%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 14%, black 86%, transparent);
            z-index: 1;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .lyrics-container::-webkit-scrollbar {
            display: none;
        }

        .lyric-line {
            font-size: 1.04rem;
            font-weight: 600;
            margin: 18px 0;
            color: rgba(255, 255, 255, 0.42);
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            line-height: 1.55;
            padding: 6px 12px;
            border-radius: 10px;
        }

        .lyric-line:hover {
            color: rgba(255, 255, 255, 0.78);
            background: rgba(255, 255, 255, 0.04);
        }

        .lyric-line.active {
            font-size: 1.32rem;
            font-weight: 800;
            color: var(--pure-white);
            transform: scale(1.02);
            text-shadow: 0 2px 14px rgba(212, 175, 55, 0.45);
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.28);
        }

        .player-controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.82rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 18px;
        }

        .progress-bar-bg {
            flex: 1;
            height: 7px;
            background-color: rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            position: relative;
            cursor: pointer;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--gold-gradient);
            border-radius: 999px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--pure-white);
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.9);
        }

        .play-btn {
            background: var(--gold-gradient);
            border: 2px solid var(--pure-white);
            color: var(--bg-dark-green);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            font-size: 1.65rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 28px rgba(212, 175, 55, 0.45);
        }

        .play-btn:active {
            transform: scale(0.94);
        }

        @media (max-width: 600px) {
            .app-container {
                padding: 18px 14px 36px;
            }
            .hero-card {
                padding: 28px 18px 24px;
            }
            .main-title {
                font-size: 1.8rem;
            }
            .menu-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .menu-btn {
                flex-direction: row;
                justify-content: flex-start;
                text-align: left;
                padding: 16px 18px;
                gap: 14px;
            }
            .menu-btn-text-wrap {
                flex: 1;
            }
            .menu-btn-count {
                margin-top: 0;
            }
            .content-header {
                padding: 18px 18px 16px;
            }
            #content-body {
                padding: 18px 16px;
            }
            .quick-nav-bar {
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>

    let currentSongIndex = 0;
    let isPlaying = false;
    let audioPlayer = document.getElementById('audio-player');
    let fallbackTimer = null;
    let simulatedTime = 0;
    let usingFallbackTimer = false;
    let currentLifeCategory = 'all';

    const app = document.getElementById('app');
    const contentTitle = document.getElementById('content-title');
    const contentBody = document.getElementById('content-body');

    function openContent(section) {
        contentTitle.innerText = contentData[section].title;
        contentBody.innerHTML = contentData[section].html;
        app.classList.add('state-content-active');

        ['life', 'training', 'song'].forEach((key) => {
            const pill = document.getElementById('nav-pill-' + key);
            if (pill) {
                if (key === section) {
                    pill.classList.add('active');
                } else {
                    pill.classList.remove('active');
                }
            }
        });

        currentLifeCategory = 'all';

        if (section === 'song') {
            initPlayer();
        } else {
            resetPlayer();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeContent() {
        app.classList.remove('state-content-active');
        resetPlayer();
    }

    function selectLifeCategory(category) {
        currentLifeCategory = category;
        const chips = document.querySelectorAll('.cat-chip');
        chips.forEach((chip) => {
            if (chip.getAttribute('data-cat') === category) {
                chip.classList.add('active');
            } else {
                chip.classList.remove('active');
            }
        });
        filterLifeRules();
    }

    function filterLifeRules() {
        const searchEl = document.getElementById('life-search-input');
        const listEl = document.getElementById('life-rule-list');
        const emptyEl = document.getElementById('life-empty-msg');
        if (!listEl) return;

        const query = searchEl ? searchEl.value.trim().toLowerCase() : '';
        const items = listEl.querySelectorAll('li');
        let visibleCount = 0;

        items.forEach((li) => {
            const cat = li.getAttribute('data-cat') || '';
            const text = li.innerText.toLowerCase();
            const catMatch = (currentLifeCategory === 'all') || (cat === currentLifeCategory);
            const textMatch = !query || text.includes(query);

            if (catMatch && textMatch) {
                li.style.display = '';
                visibleCount++;
            } else {
                li.style.display = 'none';
            }
        });

        if (emptyEl) {
            emptyEl.style.display = visibleCount === 0 ? 'block' : 'none';
        }
    }

    function stopFallbackTimer() {
        if (fallbackTimer) {
            clearInterval(fallbackTimer);
            fallbackTimer = null;
        }
    }

    function startFallbackTimer() {
        stopFallbackTimer();
        usingFallbackTimer = true;
        const song = songs[currentSongIndex];
        const totalEl = document.getElementById('total-time');
        if (totalEl) {
            totalEl.innerText = formatTime(song.fallbackDuration);
        }
        fallbackTimer = setInterval(() => {
            simulatedTime += 0.25;
            if (simulatedTime >= song.fallbackDuration) {
                resetPlayerUI();
                return;
            }
            renderProgressAndLyrics(simulatedTime, song.fallbackDuration);
        }, 250);
    }

    function initPlayer() {
        audioPlayer = document.getElementById('audio-player');

        audioPlayer.removeEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.onloadedmetadata = () => {
            usingFallbackTimer = false;
            const totalEl = document.getElementById('total-time');
            if (totalEl) {
                totalEl.innerText = formatTime(audioPlayer.duration);
            }
        };
        audioPlayer.onended = () => {
            resetPlayerUI();
        };

        loadSong(currentSongIndex);
        updateTabsUI();
    }

    function selectSong(index) {
        if (currentSongIndex === index) return;
        stopFallbackTimer();
        simulatedTime = 0;
        currentSongIndex = index;
        loadSong(index);
        updateTabsUI();

        const playBtn = document.getElementById('play-btn');
        audioPlayer.play().then(() => {
            usingFallbackTimer = false;
            isPlaying = true;
            if (playBtn) playBtn.innerHTML = '&#10074;&#10074;';
        }).catch(() => {
            isPlaying = true;
            if (playBtn) playBtn.innerHTML = '&#10074;&#10074;';
            startFallbackTimer();
        });
    }

    function updateTabsUI() {
        const tabs = document.querySelectorAll('.song-tab');
        tabs.forEach((tab, i) => {
            if (i === currentSongIndex) {
                tab.classList.add('active');
            } else {
                tab.classList.remove('active');
            }
        });
    }

    function loadSong(index) {
        const song = songs[index];
        const titleEl = document.getElementById('song-title');
        const artistEl = document.getElementById('song-artist');
        const totalEl = document.getElementById('total-time');

        if (titleEl) titleEl.innerText = song.title;
        if (artistEl) artistEl.innerText = song.artist;
        if (totalEl) totalEl.innerText = formatTime(song.fallbackDuration);

        simulatedTime = 0;
        audioPlayer.src = song.src;
        audioPlayer.load();

        const lyricsContainer = document.getElementById('lyrics-container');
        if (lyricsContainer) {
            lyricsContainer.innerHTML = '';
            song.lyrics.forEach((line, idx) => {
                const el = document.createElement('div');
                el.className = 'lyric-line' + (idx === 0 ? ' active' : '');
                el.innerText = line.text;
                el.onclick = () => jumpToTime(line.time);
                lyricsContainer.appendChild(el);
            });
        }

        const currentEl = document.getElementById('current-time');
        const fillEl = document.getElementById('progress-bar-fill');
        const playBtn = document.getElementById('play-btn');

        if (currentEl) currentEl.innerText = "0:00";
        if (fillEl) fillEl.style.width = '0%';
        if (playBtn) {
            playBtn.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9654;';
        }
    }

    function togglePlay() {
        const btn = document.getElementById('play-btn');
        if (!isPlaying) {
            audioPlayer.play().then(() => {
                usingFallbackTimer = false;
                isPlaying = true;
                if (btn) btn.innerHTML = '&#10074;&#10074;';
            }).catch(() => {
                isPlaying = true;
                if (btn) btn.innerHTML = '&#10074;&#10074;';
                startFallbackTimer();
            });
        } else {
            audioPlayer.pause();
            stopFallbackTimer();
            isPlaying = false;
            if (btn) btn.innerHTML = '&#9654;';
        }
    }

    function resetPlayer() {
        stopFallbackTimer();
        if (audioPlayer) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }
        simulatedTime = 0;
        isPlaying = false;
        currentSongIndex = 0;
    }

    function resetPlayerUI() {
        stopFallbackTimer();
        isPlaying = false;
        simulatedTime = 0;
        const playBtn = document.getElementById('play-btn');
        const fillEl = document.getElementById('progress-bar-fill');
        const currentEl = document.getElementById('current-time');
        if (playBtn) playBtn.innerHTML = '&#9654;';
        if (audioPlayer) audioPlayer.currentTime = 0;
        if (fillEl) fillEl.style.width = '0%';
        if (currentEl) currentEl.innerText = "0:00";
    }

    function updateProgress() {
        if (usingFallbackTimer || !audioPlayer.duration) return;
        renderProgressAndLyrics(audioPlayer.currentTime, audioPlayer.duration);
    }

    function renderProgressAndLyrics(currentTime, duration) {
        if (!duration) return;
        const pct = Math.min(100, (currentTime / duration) * 100);
        const fillEl = document.getElementById('progress-bar-fill');
        const currentEl = document.getElementById('current-time');

        if (fillEl) fillEl.style.width = pct + '%';
        if (currentEl) currentEl.innerText = formatTime(Math.floor(currentTime));

        const song = songs[currentSongIndex];
        const lines = document.querySelectorAll('.lyric-line');
        let activeIndex = -1;

        for (let i = 0; i < song.lyrics.length; i++) {
            if (currentTime >= song.lyrics[i].time) {
                activeIndex = i;
            }
        }

        lines.forEach((line, index) => {
            if (index === activeIndex) {
                if (!line.classList.contains('active')) {
                    line.classList.add('active');
                    line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } else {
                line.classList.remove('active');
            }
        });
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ":" + (s < 10 ? '0' : '') + s;
    }

    function jumpToTime(time) {
        const song = songs[currentSongIndex];
        simulatedTime = time;
        if (!usingFallbackTimer && audioPlayer.duration) {
            audioPlayer.currentTime = time;
            renderProgressAndLyrics(time, audioPlayer.duration);
        } else {
            renderProgressAndLyrics(time, song.fallbackDuration);
        }
        if (!isPlaying) togglePlay();
    }

    function seekSong(event) {
        const bg = document.getElementById('progress-bar-bg');
        if (!bg) return;
        const rect = bg.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const width = rect.width;
        const pct = Math.max(0, Math.min(1, clickX / width));
        const song = songs[currentSongIndex];

        if (!usingFallbackTimer && audioPlayer.duration) {
            audioPlayer.currentTime = pct * audioPlayer.duration;
            renderProgressAndLyrics(audioPlayer.currentTime, audioPlayer.duration);
        } else {
            simulatedTime = pct * song.fallbackDuration;
            renderProgressAndLyrics(simulatedTime, song.fallbackDuration);
        }
    }
</script>
